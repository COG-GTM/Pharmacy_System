version: '3.8'

services:
  # --- Infrastructure ---
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - auth-service
      - pharmacy-service
      - client-service
      - order-service
      - catalog-service
      - payment-service
      - geography-service
      - analytics-service
    networks:
      - pharmacy_net

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - pharmacy_net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - pharmacy_net

  # --- Databases (one per service) ---
  mysql-auth:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_auth_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - pharmacy_net

  mysql-pharmacy:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: pharmacy_db
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_pharmacy_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - pharmacy_net

  mysql-client:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: client_db
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_client_data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - pharmacy_net

  mysql-order:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: order_db
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_order_data:/var/lib/mysql
    ports:
      - "3309:3306"
    networks:
      - pharmacy_net

  mysql-catalog:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: catalog_db
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_catalog_data:/var/lib/mysql
    ports:
      - "3310:3306"
    networks:
      - pharmacy_net

  mysql-payment:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: payment_db
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_payment_data:/var/lib/mysql
    ports:
      - "3311:3306"
    networks:
      - pharmacy_net

  mysql-geography:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: geography_db
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_geography_data:/var/lib/mysql
    ports:
      - "3312:3306"
    networks:
      - pharmacy_net

  mysql-analytics:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: analytics_db
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_analytics_data:/var/lib/mysql
    ports:
      - "3313:3306"
    networks:
      - pharmacy_net

  # --- Services ---
  auth-service:
    build: ./services/auth-service
    ports:
      - "8001:80"
    depends_on:
      - mysql-auth
      - redis
      - rabbitmq
    environment:
      APP_NAME: "Auth Service"
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql-auth
      DB_PORT: 3306
      DB_DATABASE: auth_db
      DB_USERNAME: root
      DB_PASSWORD: secret
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      QUEUE_CONNECTION: redis
    networks:
      - pharmacy_net

  pharmacy-service:
    build: ./services/pharmacy-service
    ports:
      - "8002:80"
    depends_on:
      - mysql-pharmacy
      - redis
    environment:
      APP_NAME: "Pharmacy Service"
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql-pharmacy
      DB_PORT: 3306
      DB_DATABASE: pharmacy_db
      DB_USERNAME: root
      DB_PASSWORD: secret
      REDIS_HOST: redis
      AUTH_SERVICE_URL: "http://auth-service"
      ORDER_SERVICE_URL: "http://order-service"
    networks:
      - pharmacy_net

  client-service:
    build: ./services/client-service
    ports:
      - "8003:80"
    depends_on:
      - mysql-client
      - redis
    environment:
      APP_NAME: "Client Service"
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql-client
      DB_PORT: 3306
      DB_DATABASE: client_db
      DB_USERNAME: root
      DB_PASSWORD: secret
      REDIS_HOST: redis
      AUTH_SERVICE_URL: "http://auth-service"
    networks:
      - pharmacy_net

  order-service:
    build: ./services/order-service
    ports:
      - "8004:80"
    depends_on:
      - mysql-order
      - redis
      - rabbitmq
    environment:
      APP_NAME: "Order Service"
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql-order
      DB_PORT: 3306
      DB_DATABASE: order_db
      DB_USERNAME: root
      DB_PASSWORD: secret
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      CATALOG_SERVICE_URL: "http://catalog-service"
      PHARMACY_SERVICE_URL: "http://pharmacy-service"
      CLIENT_SERVICE_URL: "http://client-service"
      GEOGRAPHY_SERVICE_URL: "http://geography-service"
      QUEUE_CONNECTION: redis
    networks:
      - pharmacy_net

  catalog-service:
    build: ./services/catalog-service
    ports:
      - "8005:80"
    depends_on:
      - mysql-catalog
      - redis
    environment:
      APP_NAME: "Catalog Service"
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql-catalog
      DB_PORT: 3306
      DB_DATABASE: catalog_db
      DB_USERNAME: root
      DB_PASSWORD: secret
      REDIS_HOST: redis
    networks:
      - pharmacy_net

  payment-service:
    build: ./services/payment-service
    ports:
      - "8006:80"
    depends_on:
      - mysql-payment
      - redis
      - rabbitmq
    environment:
      APP_NAME: "Payment Service"
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql-payment
      DB_PORT: 3306
      DB_DATABASE: payment_db
      DB_USERNAME: root
      DB_PASSWORD: secret
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      ORDER_SERVICE_URL: "http://order-service"
      STRIPE_KEY: "pk_test_xxxxx"
      STRIPE_SECRET: "sk_test_xxxxx"
    networks:
      - pharmacy_net

  notification-service:
    build: ./services/notification-service
    depends_on:
      - redis
      - rabbitmq
    environment:
      APP_NAME: "Notification Service"
      APP_ENV: local
      APP_DEBUG: "true"
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      MAIL_MAILER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    networks:
      - pharmacy_net

  geography-service:
    build: ./services/geography-service
    ports:
      - "8008:80"
    depends_on:
      - mysql-geography
      - redis
    environment:
      APP_NAME: "Geography Service"
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql-geography
      DB_PORT: 3306
      DB_DATABASE: geography_db
      DB_USERNAME: root
      DB_PASSWORD: secret
      REDIS_HOST: redis
    networks:
      - pharmacy_net

  analytics-service:
    build: ./services/analytics-service
    ports:
      - "8009:80"
    depends_on:
      - mysql-analytics
      - redis
      - rabbitmq
    environment:
      APP_NAME: "Analytics Service"
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql-analytics
      DB_PORT: 3306
      DB_DATABASE: analytics_db
      DB_USERNAME: root
      DB_PASSWORD: secret
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    networks:
      - pharmacy_net

  # --- Shared storage ---
  shared-storage:
    image: busybox
    volumes:
      - shared_files:/data
    networks:
      - pharmacy_net

volumes:
  rabbitmq_data:
  mysql_auth_data:
  mysql_pharmacy_data:
  mysql_client_data:
  mysql_order_data:
  mysql_catalog_data:
  mysql_payment_data:
  mysql_geography_data:
  mysql_analytics_data:
  shared_files:

networks:
  pharmacy_net:
    driver: bridge
